<div class="row justify-content-center">
  <div class="col-12 col-lg-7">
    <h3 class="mb-3"><i class="bi bi-person text-tur"></i> {{ id ? 'Editar' : 'Novo' }} cliente</h3>
    @if (erro()) { <div class="alert alert-danger">{{ erro() }}</div> }

    <form [formGroup]="form" (ngSubmit)="salvar()" class="card border-0 shadow-sm p-4" novalidate>
      <div class="row g-3">
        <div class="col-12">
          <label for="nome" class="form-label">Nome completo *</label>
          <input id="nome" class="form-control" formControlName="nome" [class.is-invalid]="invalido('nome')">
          <app-campo-erro [control]="form.controls.nome" rotulo="O nome" />
        </div>
        <div class="col-sm-6">
          <label for="cpf" class="form-label">CPF *</label>
          <input id="cpf" class="form-control" formControlName="cpf" placeholder="000.000.000-00" maxlength="14" [class.is-invalid]="invalido('cpf')">
          <app-campo-erro [control]="form.controls.cpf" rotulo="O CPF" />
        </div>
        <div class="col-sm-6">
          <label for="nasc" class="form-label">Data de nascimento *</label>
          <input id="nasc" type="date" class="form-control" formControlName="dataNascimento" [max]="hoje" [class.is-invalid]="invalido('dataNascimento')">
          <app-campo-erro [control]="form.controls.dataNascimento" rotulo="A data de nascimento" />
        </div>
        <div class="col-sm-7">
          <label for="email" class="form-label">E-mail *</label>
          <input id="email" type="email" class="form-control" formControlName="email" [class.is-invalid]="invalido('email')">
          <app-campo-erro [control]="form.controls.email" rotulo="O e-mail" />
        </div>
        <div class="col-sm-5">
          <label for="tel" class="form-label">Telefone *</label>
          <input id="tel" class="form-control" formControlName="telefone" placeholder="(00) 00000-0000" [class.is-invalid]="invalido('telefone')">
          <app-campo-erro [control]="form.controls.telefone" rotulo="O telefone" />
        </div>
      </div>
      <div class="d-flex gap-2 justify-content-end mt-4">
        <a routerLink="/admin/clientes" class="btn btn-outline-secondary">Cancelar</a>
        <button type="submit" class="btn btn-tur" [disabled]="salvando()"><i class="bi bi-save me-1"></i> Salvar</button>
      </div>
    </form>
  </div>
</div>
