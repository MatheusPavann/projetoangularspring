spring.application.name=turismo-reservas
server.port=8080

# PostgreSQL - ajuste usuario/senha conforme sua instalacao
spring.datasource.url=jdbc:postgresql://localhost:5432/turismo
spring.datasource.username=postgres
spring.datasource.password=postgres

# Cria/atualiza as tabelas automaticamente a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Popula passeios de exemplo na primeira execucao (data.sql)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.continue-on-error=true
